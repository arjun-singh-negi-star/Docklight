apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag-app
data:
  APP_ENV: "production"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "rag-documents-bucket"
  DYNAMODB_TABLE_NAME: "rag-documents-metadata"
  USERS_TABLE_NAME: "rag-users"
  CONVERSATIONS_TABLE_NAME: "rag-conversations"
  BEDROCK_REGION: "us-east-1"
  BEDROCK_EMBEDDING_MODEL_ID: "amazon.titan-embed-text-v2:0"
  BEDROCK_LLM_MODEL_ID: "amazon.nova-pro-v1:0"
  EMBEDDING_DIMENSION: "1024"
  PINECONE_INDEX_NAME: "rag-knowledge-base"
  PINECONE_CLOUD: "aws"
  PINECONE_REGION: "us-east-1"
  CORS_ORIGINS: "*"
  USE_SECRETS_MANAGER: "false"
  EMBEDDING_PROVIDER: "bedrock"      # or "pinecone"
  LLM_PROVIDER: "bedrock"            # or "openai_compatible" (then also set LLM_BASE_URL, LLM_MODEL)
  REDIS_URL: "redis://redis-service:6379/0"
  RATE_LIMIT_PER_MINUTE: "20"
  CACHE_TTL_SECONDS: "3600"
  CONVERSATION_HISTORY_TURNS: "6"
  JWT_EXPIRE_MINUTES: "1440"

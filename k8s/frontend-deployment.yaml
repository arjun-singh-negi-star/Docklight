apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rag-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: <YOUR_REGISTRY>/rag-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: backend-service
            - name: BACKEND_PORT
              value: "8000"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10

# Copy this file to secret.yaml (which is .gitignore'd), fill in real values,
# and apply it BEFORE the deployments. Never commit the filled-in version.
#
#   cp k8s/secret-template.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with real values
#   kubectl apply -f k8s/secret.yaml
#
# If you're using IRSA on EKS (recommended), omit AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY entirely and rely on the pod's IAM role instead.
# Generate a real JWT secret with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-app
type: Opaque
stringData:
  PINECONE_API_KEY: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME_WITH_OPENSSL_RAND_HEX_32"
  LLM_API_KEY: "REPLACE_ME_ONLY_IF_LLM_PROVIDER_IS_OPENAI_COMPATIBLE"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"

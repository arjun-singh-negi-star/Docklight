# Lint rules are spelled out on purpose. Ruff's *defaults* change between releases (0.17 turned on
# dozens more rules than 0.6), which made CI go red on a brand-new version with no code change.
line-length = 110
target-version = "py311"

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax errors
    "F",               # pyflakes: unused imports/variables, undefined names
]

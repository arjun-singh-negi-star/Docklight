name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff bandit
      - name: Ruff (lint)
        run: ruff check app/ tests/ --line-length 110
      - name: Bandit (security scan)
        run: bandit -r app/ -ll

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=70

  build-and-push:
    needs: test
    # Only runs once you opt in (Settings -> Secrets and variables -> Actions -> Variables:
    # ENABLE_ECR_PUSH=true) and have added the AWS secrets. Otherwise lint + tests still gate every push
    # and the repo doesn't show a permanently red build.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_ECR_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: docker build -t ${{ steps.ecr-login.outputs.registry }}/docklight-rag-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t ${{ steps.ecr-login.outputs.registry }}/docklight-rag-frontend:${{ github.sha }} ./frontend

      - name: Scan images for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/docklight-rag-backend:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # report only; flip to "1" to fail the build on findings once triaged

      - name: Push backend image
        run: docker push ${{ steps.ecr-login.outputs.registry }}/docklight-rag-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ${{ steps.ecr-login.outputs.registry }}/docklight-rag-frontend:${{ github.sha }}
